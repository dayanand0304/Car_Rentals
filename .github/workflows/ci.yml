name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'cursor/**'
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: ./mvnw -B clean test

      - name: Build application JAR
        run: ./mvnw -B package -DskipTests

      - name: Build Docker image
        run: docker build -t car-rentals:${{ github.sha }} .
