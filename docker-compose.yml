services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: car_rentals
      POSTGRES_USER: car_rentals
      POSTGRES_PASSWORD: car_rentals
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/car_rentals
      DB_USERNAME: car_rentals
      DB_PASSWORD: car_rentals
      DDL_AUTO: update
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-docker-jwt-secret-key-change-me-1234567890
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
